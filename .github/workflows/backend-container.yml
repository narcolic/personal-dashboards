name: Publish backend container

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-container.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/portfolio-terminal-api
  AZURE_RESOURCE_GROUP: portfolio-terminal-rg
  AZURE_CONTAINER_APP: portfolio-terminal-api
  AZURE_SNAPSHOT_JOB: portfolio-snapshot-job
  AZURE_METADATA_JOB: portfolio-security-metadata-job
  API_BASE_URL: https://portfolio-terminal-api.yellowforest-c9892f85.northeurope.azurecontainerapps.io

jobs:
  build-and-push:
    name: Build, publish, and deploy Linux image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure with GitHub OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ env.AZURE_CONTAINER_APP }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          registryUrl: ${{ env.REGISTRY }}

      - name: Update snapshot job image when configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if az containerapp job show \
            --name "${AZURE_SNAPSHOT_JOB}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            >/dev/null 2>&1; then
            az containerapp job update \
              --name "${AZURE_SNAPSHOT_JOB}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "Snapshot job image updated."
          else
            echo "Snapshot job is not configured yet; skipping its image update."
          fi

      - name: Update security metadata job image when configured
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if az containerapp job show \
            --name "${AZURE_METADATA_JOB}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            >/dev/null 2>&1; then
            az containerapp job update \
              --name "${AZURE_METADATA_JOB}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --image "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "Security metadata job image updated."
          else
            echo "Security metadata job is not configured yet; skipping its image update."
          fi

      - name: Verify production readiness
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "${API_BASE_URL}/health/ready"; then
              echo
              echo "Production API is ready."
              exit 0
            fi

            echo "Waiting for the new revision to become ready (${attempt}/20)..."
            sleep 10
          done

          echo "Production API did not become ready in time."
          exit 1

      - name: Verify MCP discovery and authentication challenge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          metadata="$(curl --fail --silent --show-error "${API_BASE_URL}/.well-known/oauth-protected-resource")"
          expected_resource="${API_BASE_URL}/mcp"
          actual_resource="$(jq --raw-output '.resource' <<<"${metadata}")"
          if [[ "${actual_resource}" != "${expected_resource}" ]]; then
            echo "Unexpected MCP resource URI: ${actual_resource}"
            exit 1
          fi

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${API_BASE_URL}/mcp")"
          if [[ "${status}" != "401" ]]; then
            echo "Expected unauthenticated /mcp to return 401, got ${status}."
            exit 1
          fi
